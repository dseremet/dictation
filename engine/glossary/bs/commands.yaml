# Spoken punctuation (Bosnian). attach: left | right | newline | none
commands:
  - { output: ".", phrases: [tačka, tacka, točka, tocka], attach: left, not_after: [bolna, bolnu, pritisna, pritisnu, ulazna, izlazna, najbolnija, ova, ta, jedna, svaka, slaba, jaka, akupunkturna, trigger] }
  - { output: ",", phrases: [zarez, zapeta], attach: left }
  - { output: ";", phrases: [tačka zarez, tacka zarez, tačka-zarez], attach: left }
  - { output: ":", phrases: [dvotačka, dvotacka, dvije tačke, dve tačke, dvotočka, dvotocka], attach: left }
  - { output: "?", phrases: [upitnik, znak pitanja], attach: left }
  - { output: "!", phrases: [uzvičnik, uzvicnik, znak uzvika], attach: left }
  - { output: "\n", phrases: [nova linija, novi red, u novi red, novi redak, prelom reda], attach: newline }
  - { output: "\n\n", phrases: [novi pasus, novi paragraf, novi odlomak, nova stavka], attach: newline }
  - { output: "(", phrases: [otvorena zagrada, otvori zagradu, zagrada otvorena, u zagradi], attach: right }
  - { output: ")", phrases: [zatvorena zagrada, zatvori zagradu, zagrada zatvorena, zatvoriti zagradu, kraj zagrade], attach: left }
  - { output: "-", phrases: [crtica, povlaka], attach: none }
  - { output: "/", phrases: [kosa crta, kosacrta], attach: none }
  - { output: "\"", phrases: [navodnici, pod navodnicima], attach: none }
