name: laravel

on:
  push:
    paths:
      - 'packages/laravel/**'
      - '.github/workflows/laravel.yml'
  pull_request:
    paths:
      - 'packages/laravel/**'
      - '.github/workflows/laravel.yml'

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'

    defaults:
      run:
        working-directory: packages/laravel

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, pdo_sqlite, sqlite3, curl
          coverage: none

      - name: Pin Laravel / Testbench versions
        run: composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      # Laravel 11 is past its security-support window: every 11.x release
      # (up to 11.57) carries published advisories that were never backported,
      # so Composer's default advisory block refuses to install any of them.
      # We still test against 11 because hosts on 11 use this package; the
      # opt-out is limited to this CI runner and never shipped in composer.json.
      - name: Allow advisory-affected Laravel 11 (CI only)
        if: matrix.laravel == '11.*'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests (Testbench, SQLite in-memory)
        run: composer test
